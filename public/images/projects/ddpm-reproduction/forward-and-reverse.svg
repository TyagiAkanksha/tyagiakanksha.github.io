<svg xmlns="http://www.w3.org/2000/svg" width="678" height="332" viewBox="0 0 678 332" role="img" aria-labelledby="t">
  <title id="t">The two directions of a diffusion model: the forward process adds a little Gaussian noise to a real image again and again until only noise is left; the learned reverse process starts from pure noise and undoes one small step at a time until it ends with a new image</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .t { font-size: 14px; font-weight: 600; fill: #333333; }
    .s { font-size: 13px; fill: #555555; }
    .lab { font-size: 13px; font-weight: 600; fill: #0c5d57; }
    .box { fill: #f9f9f9; stroke: #555555; stroke-opacity: .3; }
    .net { fill: #eef6f5; stroke: #0f766e; stroke-width: 1.5; }
  </style>
  <rect width="678" height="332" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Forward process, left to right -->
  <text class="lab" x="1" y="15">Forward process</text>

  <rect class="box" x="0.5" y="26.5" width="146" height="90" rx="7"/>
  <text class="t" x="12" y="50">Real image</text>

  <line x1="150" y1="71" x2="172" y2="71" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>

  <rect class="box" x="177.5" y="26.5" width="146" height="90" rx="7"/>
  <text class="t" x="189" y="50">Add a little</text>
  <text class="t" x="189" y="68">Gaussian noise</text>

  <line x1="327" y1="71" x2="349" y2="71" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>

  <rect class="box" x="354.5" y="26.5" width="146" height="90" rx="7"/>
  <text class="t" x="366" y="50">Again and again</text>

  <line x1="504" y1="71" x2="526" y2="71" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>

  <rect class="box" x="531.5" y="26.5" width="146" height="90" rx="7"/>
  <text class="t" x="543" y="50">Pure noise</text>
  <text class="s" x="543" y="70">nothing is left</text>
  <text class="s" x="543" y="88">but noise</text>

  <!-- Reverse process, right to left -->
  <text class="lab" x="1" y="161">Reverse process, learned</text>

  <rect class="box" x="531.5" y="172.5" width="146" height="110" rx="7"/>
  <text class="t" x="543" y="196">Pure noise</text>
  <text class="s" x="543" y="216">where generation</text>
  <text class="s" x="543" y="234">starts</text>

  <line x1="528" y1="227" x2="506" y2="227" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>

  <rect class="net" x="354.5" y="172.5" width="146" height="110" rx="7"/>
  <text class="t" x="366" y="196">Undo one</text>
  <text class="t" x="366" y="214">small step</text>
  <text class="s" x="366" y="234">the network</text>
  <text class="s" x="366" y="252">predicts the noise</text>
  <text class="s" x="366" y="270">added at that step</text>

  <line x1="351" y1="227" x2="329" y2="227" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>

  <rect class="box" x="177.5" y="172.5" width="146" height="110" rx="7"/>
  <text class="t" x="189" y="196">Again and again</text>
  <text class="s" x="189" y="216">one small step</text>
  <text class="s" x="189" y="234">at a time</text>

  <line x1="174" y1="227" x2="152" y2="227" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>

  <rect class="box" x="0.5" y="172.5" width="146" height="110" rx="7"/>
  <text class="t" x="12" y="196">New image</text>

  <!-- Legend -->
  <rect class="net" x="0.5" y="304.5" width="22" height="16" rx="4"/>
  <text class="s" x="32" y="317">trained to predict the noise rather than the clean image; a U-Net in our reproduction</text>
</svg>
