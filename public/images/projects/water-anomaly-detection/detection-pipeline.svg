<svg xmlns="http://www.w3.org/2000/svg" width="678" height="546" viewBox="0 0 678 546" role="img" aria-labelledby="t">
  <title id="t">How detection works: plant readings go through the Graph Deviation Network, its prediction error and the decoder's reconstruction error become a per sensor score, the highest score is compared with a threshold, and an alarm is explained to the operator</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .t { font-size: 14px; font-weight: 600; fill: #333333; }
    .s { font-size: 13px; fill: #555555; }
    .host { font-size: 14px; font-weight: 700; fill: #0c5d57; }
    .box { fill: #f9f9f9; stroke: #555555; stroke-opacity: .3; }
    .ctr { fill: #ffffff; stroke: #0f766e; stroke-opacity: .45; }
    .main { fill: #eef6f5; stroke: #0f766e; stroke-width: 1.5; }
  </style>
  <rect width="678" height="546" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Plant readings -->
  <rect class="box" x="0.5" y="0.5" width="199" height="118" rx="7"/>
  <text class="t" x="12" y="24">Plant readings</text>
  <text class="s" x="12" y="44">sensors and actuators</text>
  <text class="s" x="12" y="62">across six stages,</text>
  <text class="s" x="12" y="80">a recent window</text>
  <text class="s" x="12" y="98">of each one</text>

  <line x1="203" y1="59" x2="218" y2="59" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- GDN -->
  <rect class="main" x="224.5" y="0.5" width="453" height="118" rx="9"/>
  <text class="host" x="238" y="24">Graph Deviation Network (GDN)</text>
  <text class="s" x="238" y="44">a learned embedding for every sensor, linked to</text>
  <text class="s" x="238" y="62">the few sensors it most resembles; predicts each</text>
  <text class="s" x="238" y="80">sensor's next reading from its neighbors</text>
  <text class="s" x="238" y="98">trained on normal operation only</text>

  <line x1="276" y1="122" x2="276" y2="146" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="514" y1="122" x2="514" y2="146" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Two error signals -->
  <rect class="ctr" x="0.5" y="152.5" width="326" height="96" rx="7"/>
  <text class="t" x="12" y="176">Prediction error</text>
  <text class="s" x="12" y="196">how far the prediction of each</text>
  <text class="s" x="12" y="214">sensor's next reading misses</text>

  <rect class="ctr" x="350.5" y="152.5" width="327" height="96" rx="7"/>
  <text class="t" x="362" y="176">Reconstruction error</text>
  <text class="s" x="362" y="196">a decoder, trained with GDN frozen,</text>
  <text class="s" x="362" y="214">rebuilds the recent window from</text>
  <text class="s" x="362" y="232">GDN's internal features</text>

  <line x1="163" y1="252" x2="163" y2="276" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="380" y1="252" x2="380" y2="276" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Per sensor score and ensemble -->
  <rect class="main" x="0.5" y="282.5" width="393" height="114" rx="9"/>
  <text class="host" x="12" y="306">Per sensor score</text>
  <text class="s" x="12" y="326">each error normalized and smoothed over</text>
  <text class="s" x="12" y="344">the last few steps; the larger of the two</text>
  <text class="s" x="12" y="362">counts</text>

  <rect class="box" x="424.5" y="282.5" width="253" height="114" rx="7"/>
  <text class="t" x="436" y="306">Ensemble</text>
  <text class="s" x="436" y="326">several GDN models, differing in</text>
  <text class="s" x="436" y="344">seed, number of neighbors and</text>
  <text class="s" x="436" y="362">learning rate; their per sensor</text>
  <text class="s" x="436" y="380">scores are averaged</text>

  <line x1="421" y1="339" x2="400" y2="339" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>

  <line x1="105" y1="400" x2="105" y2="424" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Score, threshold, alert -->
  <rect class="ctr" x="0.5" y="430.5" width="209" height="114" rx="7"/>
  <text class="t" x="12" y="454">Score for the moment</text>
  <text class="s" x="12" y="474">the highest per sensor</text>
  <text class="s" x="12" y="492">score</text>

  <line x1="213" y1="487" x2="228" y2="487" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>

  <rect class="ctr" x="234.5" y="430.5" width="185" height="114" rx="7"/>
  <text class="t" x="246" y="454">Threshold</text>
  <text class="s" x="246" y="474">a score above it</text>
  <text class="s" x="246" y="492">raises an alarm</text>

  <line x1="423" y1="487" x2="438" y2="487" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>

  <rect class="ctr" x="444.5" y="430.5" width="233" height="114" rx="7"/>
  <text class="t" x="456" y="454">Explained alert</text>
  <text class="s" x="456" y="474">top sensors mapped to the six</text>
  <text class="s" x="456" y="492">stages, a two hop search on the</text>
  <text class="s" x="456" y="510">learned graph; the Claude API</text>
  <text class="s" x="456" y="528">writes the operator's alert</text>
</svg>
