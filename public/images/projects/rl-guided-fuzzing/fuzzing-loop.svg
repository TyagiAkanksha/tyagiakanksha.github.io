<svg xmlns="http://www.w3.org/2000/svg" width="678" height="442" viewBox="0 0 678 442" role="img" aria-labelledby="t">
  <title id="t">How the fuzzer learns: the A2C agent chooses a mutator and a parameter, the fuzzing harness applies it to the configuration and runs the target, and the reward for crashes and coverage goes back to the agent</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .t { font-size: 14px; font-weight: 600; fill: #333333; }
    .s { font-size: 13px; fill: #555555; }
    .host { font-size: 14px; font-weight: 700; fill: #0c5d57; }
    .box { fill: #f9f9f9; stroke: #555555; stroke-opacity: .3; }
    .ctr { fill: #ffffff; stroke: #0f766e; stroke-opacity: .45; }
    .main { fill: #eef6f5; stroke: #0f766e; stroke-width: 1.5; }
  </style>
  <rect width="678" height="442" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- A2C agent -->
  <rect class="main" x="40.5" y="0.5" width="278" height="140" rx="9"/>
  <text class="host" x="54" y="24">A2C agent</text>
  <text class="s" x="54" y="46">an actor network chooses the action;</text>
  <text class="s" x="54" y="64">a critic network estimates how good</text>
  <text class="s" x="54" y="82">the current state is; the advantage</text>
  <text class="s" x="54" y="100">steers each update</text>

  <line x1="322" y1="70" x2="354" y2="70" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Action -->
  <rect class="ctr" x="360.5" y="0.5" width="317" height="140" rx="7"/>
  <text class="t" x="372" y="24">Action, on every step</text>
  <text class="s" x="372" y="44">a mutation and the parameter it applies to,</text>
  <text class="s" x="372" y="62">one of six mutators:</text>
  <text class="s" x="372" y="84">flip one bit, flip several bits,</text>
  <text class="s" x="372" y="102">replace a byte, erase a byte,</text>
  <text class="s" x="372" y="120">insert a random byte, shuffle the bytes</text>

  <line x1="519" y1="144" x2="519" y2="176" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Fuzzing harness -->
  <rect class="main" x="360.5" y="182.5" width="317" height="258" rx="9"/>
  <text class="host" x="374" y="206">Fuzzing harness</text>
  <text class="s" x="374" y="226">applies the mutation to the</text>
  <text class="s" x="374" y="244">configuration and runs the target</text>

  <rect class="ctr" x="374.5" y="258.5" width="289" height="86" rx="6"/>
  <text class="t" x="386" y="282">Target program</text>
  <text class="s" x="386" y="302">control software of a power</text>
  <text class="s" x="386" y="320">generation system</text>

  <text class="s" x="374" y="372">measures code coverage and</text>
  <text class="s" x="374" y="390">checks for a crash</text>

  <!-- State -->
  <line x1="356" y1="240" x2="324" y2="240" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>
  <rect class="box" x="40.5" y="182.5" width="278" height="114" rx="7"/>
  <text class="t" x="54" y="206">State: 40 parameters</text>
  <text class="s" x="54" y="226">read from the target's configuration</text>
  <text class="s" x="54" y="244">files: 20 frequency settings and</text>
  <text class="s" x="54" y="262">20 RPM settings, such as setpoints,</text>
  <text class="s" x="54" y="280">offsets, limits and error ranges</text>

  <line x1="179" y1="179" x2="179" y2="147" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Reward -->
  <line x1="356" y1="386" x2="324" y2="386" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>
  <rect class="ctr" x="40.5" y="326.5" width="278" height="114" rx="7"/>
  <text class="t" x="54" y="350">Reward</text>
  <text class="s" x="54" y="370">combines whether the input crashed</text>
  <text class="s" x="54" y="388">with how much of the code it covered;</text>
  <text class="s" x="54" y="406">a crash counts far more</text>
  <text class="s" x="54" y="424">than coverage</text>

  <polyline points="37,384 16,384 16,60 34,60" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>
</svg>
